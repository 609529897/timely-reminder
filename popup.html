<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注循环</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <div class="aurora" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
    </div>

    <header class="header">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>专注循环</h1>
          <span class="brand-sub">FOCUS CYCLE</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="badge" id="reminderCount">0</span>
        <button class="btn-add" id="toggleForm" aria-label="新建循环" title="新建循环">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <section class="list-section">
      <div class="list-header">
        <h2><span class="list-dot"></span> 进行中</h2>
        <button class="btn-clear" id="clearAll">全部清除</button>
      </div>
      <div id="reminderList" class="reminder-list"></div>
    </section>

    <footer class="app-foot">
      <span class="foot-note">关闭弹窗后计时继续运行</span>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal" id="modal">
        <form id="cycleForm" class="modal-form" autocomplete="off">
          <div class="modal-header">
            <span class="modal-title" id="modalTitle">新建专注循环</span>
            <button type="button" class="modal-close" id="closeModal" aria-label="关闭">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="modal-body">
            <input type="text" id="msgInput" class="input" placeholder="这次要专注什么？" maxlength="200" />

            <fieldset class="timer-config">
              <legend class="sr-only">计时设置</legend>
              <div class="config-col" data-phase="work">
                <span class="col-label">工作</span>
                <div class="num-stepper">
                  <button type="button" class="step" data-id="workVal" aria-label="减少工作分钟">−</button>
                  <input type="number" id="workVal" class="num-input" value="25" min="1" max="180" />
                  <button type="button" class="step" data-id="workVal" aria-label="增加工作分钟">+</button>
                </div>
                <span class="col-unit">分钟</span>
              </div>
              <div class="config-divider"></div>
              <div class="config-col" data-phase="rest">
                <span class="col-label">休息</span>
                <div class="num-stepper">
                  <button type="button" class="step" data-id="restVal" aria-label="减少休息分钟">−</button>
                  <input type="number" id="restVal" class="num-input" value="5" min="1" max="60" />
                  <button type="button" class="step" data-id="restVal" aria-label="增加休息分钟">+</button>
                </div>
                <span class="col-unit">分钟</span>
              </div>
            </fieldset>

            <div class="cycles-row">
              <div class="cycles-left">
                <span class="cycles-label">循环</span>
                <div class="num-stepper xs">
                  <button type="button" class="step xs" data-id="cycleVal" aria-label="减少循环次数">−</button>
                  <input type="number" id="cycleVal" class="num-input xs" value="4" min="1" max="999" />
                  <button type="button" class="step xs" data-id="cycleVal" aria-label="增加循环次数">+</button>
                </div>
              </div>
              <label class="inf-toggle">
                <input type="checkbox" id="infiniteToggle" />
                <span class="inf-body">
                  <span class="inf-knob"></span>
                </span>
                <span class="inf-label">无限</span>
              </label>
            </div>

            <div id="totalInfo" class="total-info" aria-live="polite">约 2 小时</div>

            <label class="switch-row">
              <span class="switch-label">声音提醒</span>
              <input type="checkbox" id="soundToggle" checked />
              <span class="switch-track"></span>
            </label>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-back" id="cancelForm">返回</button>
            <button type="submit" class="btn-go" id="submitBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              开始专注
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
